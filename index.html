<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>上海 行き先マップ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;background:#f0ede8;}
#root{position:relative;width:100%;height:100dvh;overflow:hidden;}
#map-svg{position:absolute;inset:0;width:100%;height:100%;}

#top-bar{
  position:absolute;top:0;left:0;right:0;z-index:20;
  display:flex;flex-direction:column;gap:5px;padding:10px 12px;
  pointer-events:none;
}
#row1{display:flex;gap:6px;align-items:center;}
#filter-btn{
  pointer-events:all;
  background:rgba(255,255,255,0.94);border:0.5px solid #ddd;
  border-radius:20px;padding:6px 14px;
  font-size:12px;font-weight:600;color:#1a1a1a;cursor:pointer;white-space:nowrap;
}
#cat-row{pointer-events:all;display:flex;gap:5px;flex-wrap:wrap;}
.cat-btn{
  background:rgba(255,255,255,0.94);border-radius:20px;
  padding:5px 11px;font-size:11px;font-weight:600;
  cursor:pointer;white-space:nowrap;transition:opacity 0.15s;
  border:1.5px solid currentColor;
}
.cat-btn.off{opacity:0.32;}

#drawer{
  position:absolute;bottom:0;left:0;right:0;
  background:#fff;border-radius:18px 18px 0 0;
  border-top:0.5px solid #ddd;
  transform:translateY(100%);
  transition:transform 0.28s cubic-bezier(.32,.72,0,1);
  z-index:30;padding-bottom:env(safe-area-inset-bottom,20px);
}
#drawer.open{transform:translateY(0);}
#drawer-handle{display:flex;align-items:center;justify-content:center;height:32px;cursor:pointer;}
#drawer-handle::before{content:'';display:block;width:40px;height:4px;border-radius:2px;background:#ccc;}
#drawer-body{padding:4px 20px 20px;}
#d-name{font-size:18px;font-weight:600;color:#1a1a1a;margin-bottom:4px;}
#d-addr{font-size:13px;color:#666;margin-bottom:10px;line-height:1.6;}
#d-note{
  font-size:13px;color:#333;
  background:#f7f7f5;border-radius:8px;
  padding:9px 12px;margin-bottom:12px;
  line-height:1.7;white-space:pre-line;
}
#d-times{display:flex;gap:7px;margin-bottom:16px;flex-wrap:wrap;}
.tb{font-size:12px;padding:5px 12px;border-radius:20px;font-weight:500;white-space:nowrap;}
.walk {background:#EAF3DE;color:#27500A;}
.taxi {background:#FAEEDA;color:#633806;}
.metro{background:#E6F1FB;color:#0C447C;}
.orig {background:#FAECE7;color:#712B13;}
#copy-btn{
  display:block;width:100%;padding:14px;
  background:#f5f5f5;border:0.5px solid #ddd;border-radius:12px;
  font-size:15px;font-weight:600;color:#1a1a1a;
  cursor:pointer;text-align:center;transition:background 0.12s;
}
#copy-btn:active{background:#e8e8e8;}
#copy-btn.copied{background:#EAF3DE;color:#27500A;border-color:#97C459;}

#legend{
  position:absolute;bottom:20px;right:12px;z-index:10;
  background:rgba(255,255,255,0.92);border:0.5px solid #ddd;border-radius:10px;
  padding:8px 11px;display:flex;flex-direction:column;gap:5px;
}
.li{display:flex;align-items:center;gap:6px;font-size:10px;color:#555;}
.ld{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.li-note{font-size:9px;color:#aaa;margin-left:2px;}
</style>
</head>
<body>
<div id="root">
<svg id="map-svg" viewBox="0 0 380 600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <rect width="380" height="600" fill="#f0ede8"/>
  <path d="M255,0 C252,40,248,70,242,100 C236,130,228,145,220,158 C210,172,200,178,195,188 C190,198,188,210,192,222 C196,234,205,242,215,255 C225,268,232,280,230,295 C228,310,218,320,214,335 C210,350,212,370,218,395 C224,420,235,450,248,480 C260,510,270,540,272,600"
        fill="none" stroke="#b8d8e8" stroke-width="13" opacity="0.75"/>
  <path d="M0,178 C50,175,100,172,140,174 C165,176,182,180,198,184 C207,186,213,188,218,190"
        fill="none" stroke="#b8d8e8" stroke-width="6" opacity="0.6"/>
  <line x1="0"   y1="270" x2="380" y2="270" stroke="#e0d8cc" stroke-width="1.2"/>
  <line x1="0"   y1="150" x2="380" y2="150" stroke="#e0d8cc" stroke-width="1"/>
  <line x1="0"   y1="420" x2="380" y2="420" stroke="#e0d8cc" stroke-width="1"/>
  <line x1="110" y1="0"   x2="110" y2="600" stroke="#e0d8cc" stroke-width="1.2"/>
  <line x1="250" y1="0"   x2="250" y2="600" stroke="#e0d8cc" stroke-width="1"/>
  <text x="54"  y="128" font-size="10" fill="#b4b2a9" font-family="sans-serif" text-anchor="middle">静安区</text>
  <text x="160" y="128" font-size="10" fill="#b4b2a9" font-family="sans-serif" text-anchor="middle">黄浦区</text>
  <text x="315" y="128" font-size="10" fill="#b4b2a9" font-family="sans-serif" text-anchor="middle">浦東新区</text>
  <text x="54"  y="350" font-size="10" fill="#b4b2a9" font-family="sans-serif" text-anchor="middle">長寧区</text>
  <text x="185" y="72"  font-size="10" fill="#b4b2a9" font-family="sans-serif" text-anchor="middle">楊浦区</text>
  <text x="315" y="490" font-size="10" fill="#b4b2a9" font-family="sans-serif" text-anchor="middle">南匯区</text>
  <g id="lines-g"></g>
  <g id="pins-g"></g>
</svg>

<div id="top-bar">
  <div id="row1">
    <div id="filter-btn" onclick="cycleFilter()">すべて</div>
  </div>
  <div id="cat-row">
    <div class="cat-btn" data-cat="起点" onclick="toggleCat(this)" style="color:#D85A30">起点</div>
    <div class="cat-btn" data-cat="空港" onclick="toggleCat(this)" style="color:#3B6D11">空港</div>
    <div class="cat-btn" data-cat="体験" onclick="toggleCat(this)" style="color:#185FA5">体験</div>
    <div class="cat-btn" data-cat="観光" onclick="toggleCat(this)" style="color:#854F0B">観光</div>
    <div class="cat-btn" data-cat="飲食" onclick="toggleCat(this)" style="color:#D4537E">飲食</div>
  </div>
</div>

<div id="legend">
  <div class="li"><div class="ld" style="background:#D85A30"></div>起点</div>
  <div class="li"><div class="ld" style="background:#3B6D11"></div>空港</div>
  <div class="li"><div class="ld" style="background:#185FA5"></div>体験</div>
  <div class="li"><div class="ld" style="background:#854F0B"></div>観光</div>
  <div class="li"><div class="ld" style="background:#D4537E"></div>飲食</div>
  <div class="li"><span style="font-size:9px;color:#999">★ = 必須</span></div>
</div>

<div id="drawer">
  <div id="drawer-handle"></div>
  <div id="drawer-body">
    <div id="d-name"></div>
    <div id="d-addr"></div>
    <div id="d-note"></div>
    <div id="d-times">
      <span class="tb" id="d-walk"></span>
      <span class="tb" id="d-taxi"></span>
      <span class="tb" id="d-metro"></span>
    </div>
    <div id="copy-btn">住所をコピー</div>
  </div>
</div>
</div>

<script>
const places = [
  {id:"hotel",      name:"ホテル",           label:"ホテル",          addr:"上海市黄浦区茂名南路58号",                                          cat:"起点",required:true, x:172,y:218,walkMin:0,   taxiMin:0,  metroMin:0,   note:""},
  {id:"hongqiao",   name:"虹橋空港",         label:"虹橋\n空港",      addr:"上海市长宁区虹桥路2550号",                                          cat:"空港",required:true, x:18, y:298,walkMin:null,taxiMin:30, metroMin:40,  note:""},
  {id:"pudong",     name:"浦東空港",         label:"浦東\n空港",      addr:"上海市浦东新区迎宾大道6000号",                                      cat:"空港",required:true, x:355,y:510,walkMin:null,taxiMin:60, metroMin:90,  note:""},
  {id:"sandbox",    name:"Sandbox VR",      label:"Sandbox\nVR",    addr:"上海市黄浦区淮海中路381号中环广场L2层",                              cat:"体験",required:true, x:170,y:252,walkMin:10, taxiMin:10, metroMin:12,  note:"4/24 14:00"},
  {id:"sleepnomore",name:"Sleep No More",   label:"Sleep\nNo More", addr:"上海市静安区北京西路1013号",                                        cat:"体験",required:false,x:122,y:174,walkMin:22, taxiMin:12, metroMin:24,  note:""},
  {id:"umeplay_y",  name:"UMEPLAY 楊浦",    label:"UMEPLAY\n楊浦",  addr:"上海市杨浦区黄兴路221号互联宝地D2栋101室",                          cat:"体験",required:true, x:220,y:78, walkMin:null,taxiMin:30, metroMin:50,  note:"4/27 10:30\nHAVEN"},
  {id:"umeplay_t",  name:"UMEPLAY 天安千樹",label:"UMEPLAY\n天安千樹",addr:"上海市普陀区莫干山路600号大洋晶典·天安千树1期F3层",               cat:"体験",required:true, x:82, y:138,walkMin:null,taxiMin:20, metroMin:40,  note:"4/24 17:45\nABEILLE, GATEMAN"},
  {id:"ins",        name:"INS新楽園",        label:"INS\n新楽園",    addr:"上海市黄浦区雁荡路109号",                                           cat:"体験",required:false,x:163,y:244,walkMin:8,  taxiMin:11, metroMin:21,  note:"HUSH=HipHop\nRADI=EDM"},
  {id:"wanhong",    name:"ワンホン",          label:"ワンホン",        addr:"上海市黄浦区丽水路88号203",                                         cat:"体験",required:true, x:182,y:270,walkMin:15, taxiMin:15, metroMin:46,  note:"4/25 13:00\n城隍廟第一購物中心"},
  {id:"disney",     name:"ディズニー",        label:"ディズニー",      addr:"上海市浦东新区川沙镇申迪西路753号上海迪士尼度假区",                  cat:"体験",required:true, x:334,y:450,walkMin:null,taxiMin:40, metroMin:75,  note:""},
  {id:"shcenter",   name:"上海タワー",        label:"上海\nタワー",    addr:"上海市浦东新区东泰路126号",                                         cat:"観光",required:false,x:290,y:192,walkMin:null,taxiMin:12, metroMin:20,  note:""},
  {id:"cpc",        name:"中共一大会址",      label:"中共\n一大会址",  addr:"上海市黄浦区兴业路76号",                                            cat:"観光",required:false,x:152,y:262,walkMin:15, taxiMin:12, metroMin:20,  note:""},
  {id:"yuyuan",     name:"豫園",             label:"豫園",            addr:"上海市黄浦区福佑路168号",                                           cat:"観光",required:true, x:196,y:292,walkMin:null,taxiMin:15, metroMin:35,  note:""},
  {id:"jing_an",    name:"静安寺",           label:"静安寺",          addr:"上海市静安区南京西路1686号",                                        cat:"観光",required:false,x:100,y:200,walkMin:null,taxiMin:12, metroMin:30,  note:""},
  {id:"yufo",       name:"玉佛禅寺",         label:"玉佛\n禅寺",      addr:"上海市普陀区安远路170号",                                           cat:"観光",required:false,x:78, y:175,walkMin:null,taxiMin:20, metroMin:33,  note:""},
  {id:"f_xiaoyang", name:"小揚生煎",         label:"小揚\n生煎",      addr:"上海市黄浦区上海城区淮海中路939-947号巴黎春天B1楼",                 cat:"飲食",required:false,x:158,y:238,walkMin:null,taxiMin:null,metroMin:null,note:"点心、チェーン"},
  {id:"f_jiajia",   name:"佳家湯包",         label:"佳家\n湯包",      addr:"上海市黄浦区徐家汇618号日月光中心泰康B2层",                         cat:"飲食",required:false,x:144,y:284,walkMin:null,taxiMin:null,metroMin:null,note:"点心、チェーン"},
  {id:"f_nanxiang", name:"南翔饅頭店",       label:"南翔\n饅頭",      addr:"上海市黄浦区豫园路87号",                                            cat:"飲食",required:false,x:202,y:300,walkMin:null,taxiMin:null,metroMin:null,note:"点心、新天地にもある"},
  {id:"f_huxinting",name:"湖心亭",           label:"湖心亭",          addr:"上海市黄浦区豫园老街257号",                                         cat:"飲食",required:false,x:198,y:310,walkMin:null,taxiMin:null,metroMin:null,note:"中国茶"},
  {id:"f_chagee",   name:"CHAGEE",          label:"CHAGEE",          addr:"上海市黄浦区福佑路234号一层西部105",                                 cat:"飲食",required:false,x:192,y:300,walkMin:null,taxiMin:null,metroMin:null,note:"チェーン"},
];

const catColors={"起点":"#D85A30","空港":"#3B6D11","体験":"#185FA5","観光":"#854F0B","飲食":"#D4537E"};

const labelOffset={
  hotel:       {dx:  0,dy:-17,anchor:"middle"},
  hongqiao:    {dx:  0,dy:-17,anchor:"middle"},
  pudong:      {dx:  0,dy:-17,anchor:"middle"},
  sandbox:     {dx: 25,dy: -4,anchor:"start"},
  sleepnomore: {dx:  0,dy:-17,anchor:"middle"},
  umeplay_y:   {dx:  0,dy:-17,anchor:"middle"},
  umeplay_t:   {dx:  0,dy:-17,anchor:"middle"},
  ins:         {dx:-25,dy: -4,anchor:"end"},
  wanhong:     {dx: 25,dy: -4,anchor:"start"},
  disney:      {dx:-26,dy: -4,anchor:"end"},
  shcenter:    {dx:  0,dy:-17,anchor:"middle"},
  cpc:         {dx:-25,dy: -4,anchor:"end"},
  yuyuan:      {dx: 25,dy: -4,anchor:"start"},
  jing_an:     {dx:-25,dy: -4,anchor:"end"},
  yufo:        {dx:  0,dy:-17,anchor:"middle"},
  f_xiaoyang:  {dx:-25,dy: -4,anchor:"end"},
  f_jiajia:    {dx:-25,dy: -4,anchor:"end"},
  f_nanxiang:  {dx: 25,dy: -4,anchor:"start"},
  f_huxinting: {dx: 25,dy: -4,anchor:"start"},
  f_chagee:    {dx: 25,dy: -4,anchor:"start"},
};

const hotel   = places[0];
const pinsG   = document.getElementById("pins-g");
const linesG  = document.getElementById("lines-g");
const drawer  = document.getElementById("drawer");
const ocMap   = {};
let activeId  = null;
let filterMode= 0;
const hiddenCats = new Set();

function buildSVG(){
  pinsG.innerHTML=""; linesG.innerHTML="";
  places.forEach(p=>{
    if(p.id==="hotel")return;
    const l=document.createElementNS("http://www.w3.org/2000/svg","line");
    l.setAttribute("x1",hotel.x);l.setAttribute("y1",hotel.y);
    l.setAttribute("x2",p.x);l.setAttribute("y2",p.y);
    l.setAttribute("stroke","#ccc");l.setAttribute("stroke-width","0.6");
    l.setAttribute("stroke-dasharray","3,5");l.setAttribute("opacity","0.3");
    l.dataset.id=p.id; linesG.appendChild(l);
  });

  places.forEach(p=>{
    const col=catColors[p.cat]||"#888";
    const r=p.id==="hotel"?10:7;
    const off=labelOffset[p.id]||{dx:0,dy:-17,anchor:"middle"};
    const g=document.createElementNS("http://www.w3.org/2000/svg","g");
    g.style.cursor="pointer"; g.dataset.id=p.id;

    const hit=document.createElementNS("http://www.w3.org/2000/svg","circle");
    hit.setAttribute("cx",p.x);hit.setAttribute("cy",p.y);
    hit.setAttribute("r","20");hit.setAttribute("fill","transparent");
    g.appendChild(hit);

    const oc=document.createElementNS("http://www.w3.org/2000/svg","circle");
    oc.setAttribute("cx",p.x);oc.setAttribute("cy",p.y);
    oc.setAttribute("r",r);oc.setAttribute("fill",col);oc.setAttribute("opacity","0.9");
    ocMap[p.id]={el:oc,base:r,gEl:g};
    g.appendChild(oc);

    const ic=document.createElementNS("http://www.w3.org/2000/svg","circle");
    ic.setAttribute("cx",p.x);ic.setAttribute("cy",p.y);
    ic.setAttribute("r",p.id==="hotel"?4.5:2.8);ic.setAttribute("fill","#fff");
    g.appendChild(ic);

    if(p.required && p.id!=="hotel"){
      const star=document.createElementNS("http://www.w3.org/2000/svg","text");
      star.setAttribute("x",p.x+r);star.setAttribute("y",p.y-r+1);
      star.setAttribute("font-size","7");star.setAttribute("fill","#F5A623");
      star.setAttribute("font-family","sans-serif");star.setAttribute("text-anchor","middle");
      star.textContent="★"; g.appendChild(star);
    }

    const lines=p.label.split("\n");
    const lx=p.x+off.dx,ly=p.y+off.dy,anchor=off.anchor;
    const fs=7.8,lh=10;
    const maxLen=Math.max(...lines.map(l=>l.length));
    const bw=maxLen*5.2+8,bh=lines.length*lh+4;
    const bx=anchor==="start"?lx-3:anchor==="end"?lx-bw+3:lx-bw/2;
    const bg=document.createElementNS("http://www.w3.org/2000/svg","rect");
    bg.setAttribute("x",bx);bg.setAttribute("y",ly-lh*lines.length+1);
    bg.setAttribute("width",bw);bg.setAttribute("height",bh);
    bg.setAttribute("fill","rgba(255,255,255,0.87)");bg.setAttribute("rx","2");
    g.appendChild(bg);

    lines.forEach((ln,i)=>{
      const t=document.createElementNS("http://www.w3.org/2000/svg","text");
      t.setAttribute("x",lx);t.setAttribute("y",ly-(lines.length-1-i)*lh);
      t.setAttribute("text-anchor",anchor);t.setAttribute("font-size",fs);
      t.setAttribute("font-family","sans-serif");t.setAttribute("fill","#2C2C2A");
      t.setAttribute("font-weight","500");t.textContent=ln;
      g.appendChild(t);
    });

    pinsG.appendChild(g);
    const tap=e=>{e.preventDefault();selectPlace(p);};
    g.addEventListener("touchend",tap,{passive:false});
    g.addEventListener("click",tap);
  });
  applyVisibility();
}

function applyVisibility(){
  places.forEach(p=>{
    const e=ocMap[p.id]; if(!e)return;
    const v=isVisible(p);
    e.gEl.style.display=v?"":"none";
    const line=linesG.querySelector(`[data-id="${p.id}"]`);
    if(line)line.style.display=v?"":"none";
  });
}

function isVisible(p){
  if(hiddenCats.has(p.cat))return false;
  if(filterMode===1&&!p.required)return false;
  if(filterMode===2&&p.required)return false;
  return true;
}

const fLabels=["すべて","★ 必須のみ","必須以外"];
function cycleFilter(){
  filterMode=(filterMode+1)%3;
  const btn=document.getElementById("filter-btn");
  btn.textContent=fLabels[filterMode];
  btn.style.background=filterMode===0?"rgba(255,255,255,0.94)":filterMode===1?"#1a1a1a":"#777";
  btn.style.color=filterMode===0?"#1a1a1a":"#fff";
  btn.style.borderColor=filterMode===0?"#ddd":filterMode===1?"#1a1a1a":"#777";
  applyVisibility();
}

function toggleCat(el){
  const cat=el.dataset.cat;
  if(hiddenCats.has(cat)){hiddenCats.delete(cat);el.classList.remove("off");}
  else{hiddenCats.add(cat);el.classList.add("off");}
  applyVisibility();
}

function closeDrawer(){
  drawer.classList.remove("open");
  if(activeId){
    const prev=ocMap[activeId];
    if(prev){prev.el.setAttribute("r",prev.base);prev.el.setAttribute("opacity","0.9");}
    activeId=null;
  }
}

function selectPlace(p){
  if(activeId){
    const prev=ocMap[activeId];
    if(prev){prev.el.setAttribute("r",prev.base);prev.el.setAttribute("opacity","0.9");}
  }
  activeId=p.id;
  ocMap[p.id].el.setAttribute("r",ocMap[p.id].base+4);
  ocMap[p.id].el.setAttribute("opacity","1");

  document.getElementById("d-name").textContent=p.name;
  document.getElementById("d-addr").textContent=p.addr;

  const noteEl=document.getElementById("d-note");
  if(p.note){noteEl.style.display="block";noteEl.textContent=p.note;}
  else{noteEl.style.display="none";}

  const wEl=document.getElementById("d-walk");
  const tEl=document.getElementById("d-taxi");
  const mEl=document.getElementById("d-metro");

  if(p.id==="hotel"){
    wEl.className="tb orig";wEl.textContent="★ 起点";wEl.style.display="";
    tEl.style.display="none";mEl.style.display="none";
  } else {
    wEl.style.display=p.walkMin!=null?"":"none";
    tEl.style.display=p.taxiMin!=null?"":"none";
    mEl.style.display=p.metroMin!=null?"":"none";
    if(p.walkMin!=null){wEl.className="tb walk";wEl.textContent=p.walkMin>0?"徒歩 "+p.walkMin+"分":"徒歩 遠距離";}
    if(p.taxiMin!=null){tEl.className="tb taxi";tEl.textContent="タクシー "+p.taxiMin+"分";}
    if(p.metroMin!=null){mEl.className="tb metro";mEl.textContent="地下鉄 "+p.metroMin+"分";}
  }

  const btn=document.getElementById("copy-btn");
  btn.textContent="住所をコピー";btn.className="";
  btn.onclick=()=>doCopy(p);
  drawer.classList.add("open");
}

document.getElementById("drawer-handle").addEventListener("click",closeDrawer);

function doCopy(p){
  const btn=document.getElementById("copy-btn");
  const done=()=>{btn.textContent="✓ コピーしました！";btn.className="copied";setTimeout(closeDrawer,800);};
  if(navigator.clipboard){navigator.clipboard.writeText(p.addr).then(done).catch(()=>{fb(p.addr);done();});}
  else{fb(p.addr);done();}
}
function fb(t){
  const ta=document.createElement("textarea");
  ta.value=t;ta.style.cssText="position:fixed;opacity:0;";
  document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta);
}

buildSVG();
</script>
