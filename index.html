
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
.pin-group { cursor: pointer; }
.pin-circle { transition: r 0.15s; }
#tooltip {
  position: absolute;
  background: var(--color-background-primary);
  border: 0.5px solid var(--color-border-secondary);
  border-radius: var(--border-radius-md);
  padding: 10px 14px;
  font-size: 13px;
  pointer-events: none;
  max-width: 230px;
  display: none;
  z-index: 10;
}
#tooltip .tt-name { font-weight: 500; font-size: 14px; color: var(--color-text-primary); margin-bottom: 4px; }
#tooltip .tt-addr { color: var(--color-text-secondary); font-size: 12px; margin-bottom: 6px; line-height: 1.4; }
#tooltip .tt-times { display: flex; gap: 8px; margin-bottom: 6px; }
#tooltip .tb { font-size: 11px; padding: 2px 8px; border-radius: 20px; }
#tooltip .walk { background: #EAF3DE; color: #3B6D11; }
#tooltip .taxi { background: #FAEEDA; color: #854F0B; }
#tooltip .hint { font-size: 11px; color: var(--color-text-tertiary); }
#copy-toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: #444441; color: #fff; padding: 8px 18px;
  border-radius: 20px; font-size: 13px; opacity: 0;
  transition: opacity 0.3s; pointer-events: none; z-index: 100;
}
.legend { display: flex; gap: 16px; padding: 10px 14px; flex-wrap: wrap; border-top: 0.5px solid var(--color-border-tertiary); }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--color-text-secondary); }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.tap-hint { text-align: center; font-size: 12px; color: var(--color-text-tertiary); padding: 6px 0 8px; }
#map-wrap { position: relative; background: #ddeef5; border-radius: var(--border-radius-lg); border: 0.5px solid var(--color-border-tertiary); overflow: hidden; }
</style>

<div id="map-wrap">
<svg id="map-svg" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;">
  <!-- land -->
  <rect width="680" height="420" fill="#f0ede8"/>
  <!-- Huangpu River -->
  <path d="M340,0 C345,60 355,100 360,140 C365,180 350,210 345,250 C340,290 345,340 350,420" fill="none" stroke="#b8d8e8" stroke-width="14" opacity="0.7"/>
  <!-- Suzhou Creek -->
  <path d="M0,165 C80,162 150,158 210,162 C250,165 280,168 320,166 C340,165 352,162 360,160" fill="none" stroke="#b8d8e8" stroke-width="7" opacity="0.6"/>
  <!-- Grid roads -->
  <line x1="0" y1="200" x2="680" y2="200" stroke="#e0d8cc" stroke-width="1.5"/>
  <line x1="200" y1="0" x2="200" y2="420" stroke="#e0d8cc" stroke-width="1.5"/>
  <line x1="400" y1="0" x2="400" y2="420" stroke="#e0d8cc" stroke-width="1"/>
  <line x1="0" y1="300" x2="680" y2="300" stroke="#e0d8cc" stroke-width="1"/>
  <line x1="0" y1="120" x2="680" y2="120" stroke="#e0d8cc" stroke-width="1"/>
  <!-- Area labels -->
  <text x="90"  y="95"  font-size="10" fill="#b4b2a9" font-family="sans-serif" text-anchor="middle">静安区</text>
  <text x="280" y="95"  font-size="10" fill="#b4b2a9" font-family="sans-serif" text-anchor="middle">黄浦区</text>
  <text x="460" y="95"  font-size="10" fill="#b4b2a9" font-family="sans-serif" text-anchor="middle">浦東新区</text>
  <text x="90"  y="280" font-size="10" fill="#b4b2a9" font-family="sans-serif" text-anchor="middle">長寧区</text>
  <!-- dashed lines layer -->
  <g id="lines"></g>
  <!-- pins layer -->
  <g id="pins"></g>
</svg>
<div id="tooltip">
  <div class="tt-name" id="tt-name"></div>
  <div class="tt-addr" id="tt-addr"></div>
  <div class="tt-times">
    <span class="tb walk" id="tt-walk"></span>
    <span class="tb taxi" id="tt-taxi"></span>
  </div>
  <div class="hint">タップで住所をコピー</div>
</div>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#D85A30"></div>ガーデンホテル（起点）</div>
  <div class="legend-item"><div class="legend-dot" style="background:#185FA5"></div>観光・体験</div>
  <div class="legend-item"><div class="legend-dot" style="background:#3B6D11"></div>空港</div>
</div>
<div class="tap-hint">ホバーで詳細 / タップで住所コピー</div>
<div id="copy-toast">住所をコピーしました！</div>

<script>
const places = [
  { id:"garden",       name:"ガーデンホテル",               label:"ガーデン\nホテル",          addr:"茂名南路58号",                                          cat:"hotel",      x:298, y:178, walkMin:0,    taxiMin:0  },
  { id:"hongqiao",     name:"虹橋国際空港",                 label:"虹橋空港",                  addr:"上海市长宁区虹桥路2550号",                              cat:"airport",    x:44,  y:218, walkMin:null, taxiMin:30 },
  { id:"pudong",       name:"浦東国際空港",                 label:"浦東空港",                  addr:"迎宾大道6000号",                                        cat:"airport",    x:636, y:372, walkMin:null, taxiMin:50 },
  { id:"shcenter",     name:"上海中心大廈",                 label:"上海中心\n大廈",             addr:"上海市浦东新区东泰路126号",                             cat:"attraction", x:430, y:148, walkMin:null, taxiMin:15 },
  { id:"yuyuan",       name:"豫園",                        label:"豫園",                      addr:"福佑路168号",                                           cat:"attraction", x:356, y:234, walkMin:25,   taxiMin:8  },
  { id:"cpc",          name:"一大会址",                    label:"一大会址",                   addr:"兴业路76号",                                            cat:"attraction", x:278, y:226, walkMin:15,   taxiMin:5  },
  { id:"ins",          name:"INS新楽園",                   label:"INS\n新楽園",               addr:"雁荡路109号",                                           cat:"attraction", x:312, y:204, walkMin:8,    taxiMin:3  },
  { id:"sleepnomore",  name:"SleepNoMore",                 label:"Sleep\nNoMore",             addr:"北京西路1013号",                                        cat:"attraction", x:244, y:146, walkMin:22,   taxiMin:7  },
  { id:"umeplay_tian", name:"UMEPLAY天安千樹店",            label:"UMEPLAY\n天安千樹",         addr:"上海市普陀区莫干山路600号大洋晶典·天安千树",            cat:"attraction", x:186, y:126, walkMin:null, taxiMin:20 },
  { id:"umeplay_yang", name:"UMEPLAY楊浦店",               label:"UMEPLAY\n楊浦店",           addr:"上海市杨浦区黄兴路221号互联宝地D2栋101室",              cat:"attraction", x:432, y:88,  walkMin:null, taxiMin:25 },
  { id:"sandbox",      name:"SANDBOX VR",                  label:"SANDBOX\nVR",              addr:"淮海中路381号中环广场L2层",                             cat:"attraction", x:272, y:200, walkMin:12,   taxiMin:4  },
];

const colors = { hotel:"#D85A30", airport:"#3B6D11", attraction:"#185FA5" };
const hotel = places.find(p => p.id === "garden");
const svgEl = document.getElementById("map-svg");
const pinsG = document.getElementById("pins");
const linesG = document.getElementById("lines");
const tooltip = document.getElementById("tooltip");
const wrap = document.getElementById("map-wrap");

// dashed connector lines
places.forEach(p => {
  if (p.id === "garden") return;
  const l = document.createElementNS("http://www.w3.org/2000/svg","line");
  l.setAttribute("x1", hotel.x); l.setAttribute("y1", hotel.y);
  l.setAttribute("x2", p.x);     l.setAttribute("y2", p.y);
  l.setAttribute("stroke","#ccc"); l.setAttribute("stroke-width","0.8");
  l.setAttribute("stroke-dasharray","3,5"); l.setAttribute("opacity","0.55");
  linesG.appendChild(l);
});

// label offset table (to avoid overlap)
const labelOffset = {
  garden:       { dx: 0,   dy:-18 },
  hongqiao:     { dx: 0,   dy:-18 },
  pudong:       { dx: 0,   dy:-18 },
  shcenter:     { dx: 0,   dy:-18 },
  yuyuan:       { dx:18,   dy: -6 },
  cpc:          { dx:-34,  dy: -6 },
  ins:          { dx: 16,  dy: -6 },
  sleepnomore:  { dx: 0,   dy:-18 },
  umeplay_tian: { dx: 0,   dy:-18 },
  umeplay_yang: { dx: 0,   dy:-18 },
  sandbox:      { dx:-36,  dy: -6 },
};

places.forEach(p => {
  const col = colors[p.cat] || colors.attraction;
  const r = p.id === "garden" ? 9 : 7;
  const off = labelOffset[p.id] || {dx:0, dy:-16};

  const g = document.createElementNS("http://www.w3.org/2000/svg","g");
  g.setAttribute("class","pin-group");

  // invisible hit area — prevents jitter from leaving the circle
  const hit = document.createElementNS("http://www.w3.org/2000/svg","circle");
  hit.setAttribute("cx", p.x); hit.setAttribute("cy", p.y);
  hit.setAttribute("r","20"); hit.setAttribute("fill","transparent");
  g.appendChild(hit);

  // outer circle
  const oc = document.createElementNS("http://www.w3.org/2000/svg","circle");
  oc.setAttribute("class","pin-circle"); oc.setAttribute("cx", p.x); oc.setAttribute("cy", p.y);
  oc.setAttribute("r", r); oc.setAttribute("fill", col); oc.setAttribute("opacity","0.9");
  g.appendChild(oc);

  // inner dot
  const ic = document.createElementNS("http://www.w3.org/2000/svg","circle");
  ic.setAttribute("cx", p.x); ic.setAttribute("cy", p.y);
  ic.setAttribute("r", p.id==="garden"?4:3); ic.setAttribute("fill","#fff");
  g.appendChild(ic);

  // label lines
  const lines = p.label.split("\n");
  const lx = p.x + off.dx;
  const ly = p.y + off.dy;
  const fontSize = 9.5;
  const lineH = 11;

  // label background rect
  const maxLen = Math.max(...lines.map(l=>l.length));
  const bw = maxLen * 5.8 + 6;
  const bh = lines.length * lineH + 2;
  const bg = document.createElementNS("http://www.w3.org/2000/svg","rect");
  bg.setAttribute("x", lx - bw/2); bg.setAttribute("y", ly - lineH * lines.length + 1);
  bg.setAttribute("width", bw); bg.setAttribute("height", bh);
  bg.setAttribute("fill","rgba(255,255,255,0.75)"); bg.setAttribute("rx","2");
  g.appendChild(bg);

  lines.forEach((line, i) => {
    const t = document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("x", lx);
    t.setAttribute("y", ly - (lines.length - 1 - i) * lineH);
    t.setAttribute("text-anchor","middle");
    t.setAttribute("font-size", fontSize);
    t.setAttribute("font-family","sans-serif");
    t.setAttribute("fill","#2C2C2A");
    t.setAttribute("font-weight","500");
    t.textContent = line;
    g.appendChild(t);
  });

  pinsG.appendChild(g);

  // events — all on the <g>, pointer-events handled by large hit circle
  g.addEventListener("mouseenter", e => showTT(e, p));
  g.addEventListener("mousemove",  e => moveTT(e));
  g.addEventListener("mouseleave", hideTT);
  g.addEventListener("click", () => copyAddr(p));
});

let currentP = null;
function showTT(e, p) {
  currentP = p;
  document.getElementById("tt-name").textContent = p.name;
  document.getElementById("tt-addr").textContent = p.addr;
  const wEl = document.getElementById("tt-walk");
  const tEl = document.getElementById("tt-taxi");
  if (p.id === "garden") {
    wEl.textContent = "★ 起点"; wEl.style.background="#FAECE7"; wEl.style.color="#993C1D";
    tEl.style.display="none";
  } else {
    tEl.style.display="";
    wEl.style.background="#EAF3DE"; wEl.style.color="#3B6D11";
    wEl.textContent = p.walkMin ? "🚶 "+p.walkMin+"分" : "🚶 遠距離";
    tEl.textContent = "🚕 "+p.taxiMin+"分";
  }
  tooltip.style.display = "block";
  moveTT(e);
}
function moveTT(e) {
  const r = wrap.getBoundingClientRect();
  let lft = e.clientX - r.left + 14;
  let top = e.clientY - r.top - 10;
  if (lft + 230 > r.width) lft = e.clientX - r.left - 240;
  if (top < 0) top = 0;
  tooltip.style.left = lft+"px";
  tooltip.style.top  = top+"px";
}
function hideTT() { tooltip.style.display="none"; currentP=null; }

function copyAddr(p) {
  const t = p.addr;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(t).then(showToast).catch(()=>fbCopy(t));
  } else { fbCopy(t); }
}
function fbCopy(t) {
  const ta = document.createElement("textarea");
  ta.value = t; ta.style.cssText="position:fixed;opacity:0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); } catch(e){}
  document.body.removeChild(ta); showToast();
}
let toastTimer;
function showToast() {
  const el = document.getElementById("copy-toast");
  el.style.opacity="1"; clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ el.style.opacity="0"; }, 1800);
}
</script>
