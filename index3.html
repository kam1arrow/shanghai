<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>上海 行き先マップ</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif; background: #f0ede8; }

#root { position: relative; width: 100%; height: 100dvh; overflow: hidden; }
#map-svg { position: absolute; inset: 0; width: 100%; height: 100%; }

#drawer {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: #fff;
  border-radius: 18px 18px 0 0;
  border-top: 0.5px solid #ddd;
  transform: translateY(100%);
  transition: transform 0.28s cubic-bezier(.32,.72,0,1);
  z-index: 30;
  padding: 0 0 env(safe-area-inset-bottom, 20px);
}
#drawer.open { transform: translateY(0); }

#drawer-handle {
  display: flex; align-items: center; justify-content: center;
  height: 32px; cursor: pointer;
}
#drawer-handle::before {
  content: ''; display: block; width: 40px; height: 4px;
  border-radius: 2px; background: #ccc;
}

#drawer-body { padding: 4px 20px 20px; }
#d-name { font-size: 18px; font-weight: 600; color: #1a1a1a; margin-bottom: 5px; }
#d-addr { font-size: 13px; color: #666; margin-bottom: 14px; line-height: 1.6; }
#d-times { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.tb { font-size: 12px; padding: 5px 14px; border-radius: 20px; font-weight: 500; }
.walk  { background: #EAF3DE; color: #27500A; }
.taxi  { background: #FAEEDA; color: #633806; }
.orig  { background: #FAECE7; color: #712B13; }

#copy-btn {
  display: block; width: 100%; padding: 15px;
  background: #f5f5f5; border: 0.5px solid #ddd;
  border-radius: 12px; font-size: 15px; font-weight: 600;
  color: #1a1a1a; cursor: pointer; text-align: center;
  transition: background 0.12s;
}
#copy-btn:active { background: #e8e8e8; }
#copy-btn.copied { background: #EAF3DE; color: #27500A; border-color: #97C459; }

#legend {
  position: absolute; top: 14px; left: 14px;
  background: rgba(255,255,255,0.92);
  border: 0.5px solid #ddd; border-radius: 10px;
  padding: 9px 12px; display: flex; flex-direction: column;
  gap: 6px; z-index: 10;
}
.li { display: flex; align-items: center; gap: 7px; font-size: 11px; color: #555; }
.ld { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

#toast {
  position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
  background: rgba(40,40,40,0.88); color: #fff;
  padding: 9px 20px; border-radius: 22px;
  font-size: 13px; font-weight: 500;
  opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 50;
  white-space: nowrap;
}
</style>
</head>
<body>
<div id="root">
<svg id="map-svg" viewBox="0 0 380 600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <rect width="380" height="600" fill="#f0ede8"/>
  <path d="M222,0 C227,80 234,140 236,195 C239,250 227,290 223,340 C219,390 222,470 225,600" fill="none" stroke="#b8d8e8" stroke-width="15" opacity="0.7"/>
  <path d="M0,195 C60,192 115,188 155,192 C182,195 198,198 218,197 C226,196 230,194 235,193" fill="none" stroke="#b8d8e8" stroke-width="8" opacity="0.6"/>
  <line x1="0" y1="270" x2="380" y2="270" stroke="#e0d8cc" stroke-width="1.5"/>
  <line x1="0" y1="150" x2="380" y2="150" stroke="#e0d8cc" stroke-width="1"/>
  <line x1="0" y1="420" x2="380" y2="420" stroke="#e0d8cc" stroke-width="1"/>
  <line x1="120" y1="0" x2="120" y2="600" stroke="#e0d8cc" stroke-width="1.5"/>
  <line x1="270" y1="0" x2="270" y2="600" stroke="#e0d8cc" stroke-width="1"/>
  <text x="58"  y="130" font-size="10" fill="#b4b2a9" font-family="sans-serif" text-anchor="middle">静安区</text>
  <text x="172" y="130" font-size="10" fill="#b4b2a9" font-family="sans-serif" text-anchor="middle">黄浦区</text>
  <text x="316" y="130" font-size="10" fill="#b4b2a9" font-family="sans-serif" text-anchor="middle">浦東新区</text>
  <text x="58"  y="360" font-size="10" fill="#b4b2a9" font-family="sans-serif" text-anchor="middle">長寧区</text>
  <text x="316" y="500" font-size="10" fill="#b4b2a9" font-family="sans-serif" text-anchor="middle">南匯区</text>
  <g id="lines-g"></g>
  <g id="pins-g"></g>
</svg>

<div id="legend">
  <div class="li"><div class="ld" style="background:#D85A30"></div>起点</div>
  <div class="li"><div class="ld" style="background:#185FA5"></div>観光・体験</div>
  <div class="li"><div class="ld" style="background:#3B6D11"></div>空港</div>
  <div class="li"><div class="ld" style="background:#D4537E"></div>テーマパーク</div>
</div>

<div id="drawer">
  <div id="drawer-handle"></div>
  <div id="drawer-body">
    <div id="d-name"></div>
    <div id="d-addr"></div>
    <div id="d-times">
      <span class="tb" id="d-walk"></span>
      <span class="tb" id="d-taxi"></span>
    </div>
    <div id="copy-btn">住所をコピー</div>
  </div>
</div>

<div id="toast">✓ コピーしました！</div>
</div>

<script>
const places = [
  { id:"garden",      name:"ガーデンホテル",        label:"ガーデン\nホテル",    addr:"茂名南路58号",                                   cat:"hotel",      x:186, y:214, walkMin:0,    taxiMin:0  },
  { id:"hongqiao",    name:"虹橋国際空港",           label:"虹橋\n空港",          addr:"上海市长宁区虹桥路2550号",                       cat:"airport",    x:22,  y:300, walkMin:null, taxiMin:30 },
  { id:"pudong",      name:"浦東国際空港",           label:"浦東\n空港",          addr:"迎宾大道6000号",                                 cat:"airport",    x:354, y:510, walkMin:null, taxiMin:50 },
  { id:"disney",      name:"上海ディズニーランド",   label:"ディズニー\nランド",  addr:"上海市浦东新区川沙新镇申迪西路333号",            cat:"theme",      x:340, y:448, walkMin:null, taxiMin:45 },
  { id:"shcenter",    name:"上海中心大廈",           label:"上海中心\n大廈",      addr:"上海市浦东新区东泰路126号",                      cat:"attraction", x:296, y:178, walkMin:null, taxiMin:15 },
  { id:"yuyuan",      name:"豫園",                  label:"豫園",                addr:"福佑路168号",                                    cat:"attraction", x:248, y:278, walkMin:25,   taxiMin:8  },
  { id:"cpc",         name:"一大会址",              label:"一大\n会址",          addr:"兴业路76号",                                     cat:"attraction", x:160, y:272, walkMin:15,   taxiMin:5  },
  { id:"ins",         name:"INS新楽園",             label:"INS\n新楽園",        addr:"雁荡路109号",                                    cat:"attraction", x:200, y:248, walkMin:8,    taxiMin:3  },
  { id:"sleepnomore", name:"SleepNoMore",           label:"Sleep\nNoMore",      addr:"北京西路1013号",                                 cat:"attraction", x:138, y:174, walkMin:22,   taxiMin:7  },
  { id:"umeplay_t",   name:"UMEPLAY 天安千樹店",    label:"UMEPLAY\n天安千樹",  addr:"上海市普陀区莫干山路600号大洋晶典·天安千树",    cat:"attraction", x:96,  y:144, walkMin:null, taxiMin:20 },
  { id:"umeplay_y",   name:"UMEPLAY 楊浦店",        label:"UMEPLAY\n楊浦店",    addr:"上海市杨浦区黄兴路221号互联宝地D2栋101室",      cat:"attraction", x:298, y:96,  walkMin:null, taxiMin:25 },
  { id:"sandbox",     name:"SANDBOX VR",            label:"SANDBOX\nVR",        addr:"淮海中路381号中环广场L2层",                      cat:"attraction", x:166, y:258, walkMin:12,   taxiMin:4  },
];

const colors = { hotel:"#D85A30", airport:"#3B6D11", attraction:"#185FA5", theme:"#D4537E" };
const hotel  = places[0];
const pinsG  = document.getElementById("pins-g");
const linesG = document.getElementById("lines-g");
const drawer = document.getElementById("drawer");
const ocMap  = {};
let activeId = null;

const labelOffset = {
  garden:      { dx:0,   dy:-18 },
  hongqiao:    { dx:0,   dy:-18 },
  pudong:      { dx:0,   dy:-18 },
  disney:      { dx:-30, dy:-6  },
  shcenter:    { dx:0,   dy:-18 },
  yuyuan:      { dx:22,  dy:-6  },
  cpc:         { dx:-24, dy:-18 },
  ins:         { dx:22,  dy:-6  },
  sleepnomore: { dx:0,   dy:-18 },
  umeplay_t:   { dx:0,   dy:-18 },
  umeplay_y:   { dx:0,   dy:-18 },
  sandbox:     { dx:-26, dy:-6  },
};

places.forEach(p => {
  if (p.id === "garden") return;
  const l = document.createElementNS("http://www.w3.org/2000/svg","line");
  l.setAttribute("x1", hotel.x); l.setAttribute("y1", hotel.y);
  l.setAttribute("x2", p.x);     l.setAttribute("y2", p.y);
  l.setAttribute("stroke","#ccc"); l.setAttribute("stroke-width","0.8");
  l.setAttribute("stroke-dasharray","3,5"); l.setAttribute("opacity","0.45");
  linesG.appendChild(l);
});

places.forEach(p => {
  const col = colors[p.cat];
  const r   = p.id === "garden" ? 10 : 8;
  const off = labelOffset[p.id] || { dx:0, dy:-18 };
  const g   = document.createElementNS("http://www.w3.org/2000/svg","g");
  g.style.cursor = "pointer";

  const hit = document.createElementNS("http://www.w3.org/2000/svg","circle");
  hit.setAttribute("cx",p.x); hit.setAttribute("cy",p.y);
  hit.setAttribute("r","22"); hit.setAttribute("fill","transparent");
  g.appendChild(hit);

  const oc = document.createElementNS("http://www.w3.org/2000/svg","circle");
  oc.setAttribute("cx",p.x); oc.setAttribute("cy",p.y);
  oc.setAttribute("r",r); oc.setAttribute("fill",col); oc.setAttribute("opacity","0.88");
  ocMap[p.id] = { el:oc, base:r };
  g.appendChild(oc);

  const ic = document.createElementNS("http://www.w3.org/2000/svg","circle");
  ic.setAttribute("cx",p.x); ic.setAttribute("cy",p.y);
  ic.setAttribute("r", p.id==="garden" ? 4.5 : 3); ic.setAttribute("fill","#fff");
  g.appendChild(ic);

  const lines = p.label.split("\n");
  const lx = p.x + off.dx, ly = p.y + off.dy;
  const fs = 8.5, lh = 10.5;
  const bw = Math.max(...lines.map(l=>l.length)) * 5.6 + 8;
  const bh = lines.length * lh + 4;
  const bg = document.createElementNS("http://www.w3.org/2000/svg","rect");
  bg.setAttribute("x", lx - bw/2); bg.setAttribute("y", ly - lh*lines.length + 1);
  bg.setAttribute("width", bw); bg.setAttribute("height", bh);
  bg.setAttribute("fill","rgba(255,255,255,0.85)"); bg.setAttribute("rx","2");
  g.appendChild(bg);

  lines.forEach((ln, i) => {
    const t = document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("x", lx); t.setAttribute("y", ly - (lines.length-1-i)*lh);
    t.setAttribute("text-anchor","middle"); t.setAttribute("font-size", fs);
    t.setAttribute("font-family","sans-serif"); t.setAttribute("fill","#2C2C2A");
    t.setAttribute("font-weight","500"); t.textContent = ln;
    g.appendChild(t);
  });

  pinsG.appendChild(g);

  const tap = e => { e.preventDefault(); selectPlace(p); };
  g.addEventListener("touchend", tap, { passive:false });
  g.addEventListener("click", tap);
});

function closeDrawer() {
  drawer.classList.remove("open");
  if (activeId) {
    const prev = ocMap[activeId];
    if (prev) { prev.el.setAttribute("r", prev.base); prev.el.setAttribute("opacity","0.88"); }
    activeId = null;
  }
}

function selectPlace(p) {
  if (activeId) {
    const prev = ocMap[activeId];
    if (prev) { prev.el.setAttribute("r", prev.base); prev.el.setAttribute("opacity","0.88"); }
  }
  activeId = p.id;
  ocMap[p.id].el.setAttribute("r", ocMap[p.id].base + 4);
  ocMap[p.id].el.setAttribute("opacity","1");

  document.getElementById("d-name").textContent = p.name;
  document.getElementById("d-addr").textContent = p.addr;

  const wEl = document.getElementById("d-walk");
  const tEl = document.getElementById("d-taxi");
  if (p.id === "garden") {
    wEl.className = "tb orig"; wEl.textContent = "★ 起点";
    tEl.style.display = "none";
  } else {
    tEl.style.display = "";
    wEl.className = "tb walk";
    wEl.textContent = p.walkMin ? "徒歩 " + p.walkMin + "分" : "徒歩 遠距離";
    tEl.className = "tb taxi";
    tEl.textContent = "タクシー " + p.taxiMin + "分";
  }

  const btn = document.getElementById("copy-btn");
  btn.textContent = "住所をコピー";
  btn.className = "";
  btn.onclick = () => doCopy(p);

  drawer.classList.add("open");
}

document.getElementById("drawer-handle").addEventListener("click", closeDrawer);

let toastTimer;
function showToast() {
  const t = document.getElementById("toast");
  t.style.opacity = "1";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.opacity = "0"; }, 1500);
}

function doCopy(p) {
  const btn = document.getElementById("copy-btn");
  const done = () => {
    btn.textContent = "✓ コピーしました！";
    btn.className = "copied";
    showToast();
    setTimeout(closeDrawer, 800);
  };
  if (navigator.clipboard) {
    navigator.clipboard.writeText(p.addr).then(done).catch(() => { fb(p.addr); done(); });
  } else { fb(p.addr); done(); }
}

function fb(t) {
  const ta = document.createElement("textarea");
  ta.value = t; ta.style.cssText = "position:fixed;opacity:0;";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); } catch(e) {}
  document.body.removeChild(ta);
}
</script>
</body>
</html>
